[package]
name = "dock"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "A minimal, ultra-light, OLED-black floating dock for Windows 11, written in Rust with no UI framework."
license = "MIT"
repository = "https://github.com/gitgiovik/mini-oled-dock"
readme = "README.md"
keywords = ["windows", "dock", "taskbar", "oled", "win32"]
categories = ["os::windows-apis", "gui"]
build = "build.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows-core = "0.62.2"
# IAsyncOperation / AsyncOperationCompletedHandler and IVectorView are NOT re-exported by `windows`
# (needed for the WinRT notification listener): same versions already in Cargo.lock as dependencies of `windows`.
windows-future = "0.3.2"
windows-collections = "0.3.2"
windows = { version = "0.62.2", features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-manifest = "1.5.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
